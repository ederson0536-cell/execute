<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 合约监控面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }
        .header h1 { font-size: 24px; color: #58a6ff; }
        .refresh { color: #8b949e; font-size: 14px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 1200px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: #161b22;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #30363d;
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 500; }
        .positive { color: #3fb950; }
        .negative { color: #f85149; }
        .rank { color: #8b949e; width: 30px; }
        .symbol { font-weight: 600; color: #58a6ff; }
        .oi { font-size: 12px; color: #8b949e; }
        .loading { color: #8b949e; text-align: center; padding: 20px; }
        .signal-green { color: #3fb950; }
        .signal-red { color: #f85149; }
        .signal-neutral { color: #8b949e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 币安合约实时监控面板</h1>
        <div class="refresh">更新时间: <span id="updateTime">--:--:--</span> | <button onclick="loadAll()">🔄 刷新</button></div>
    </div>
    
    <div class="grid">
        <div class="card">
            <h2>🚀 涨幅榜 TOP20 (有持仓)</h2>
            <table>
                <thead><tr><th>#</th><th>币种</th><th>价格</th><th>24h涨幅</th><th>OI持仓</th></tr></thead>
                <tbody id="gainers"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
            </table>
        </div>
        
        <div class="card">
            <h2>💸 跌幅榜 TOP20 (有持仓)</h2>
            <table>
                <thead><tr><th>#</th><th>币种</th><th>价格</th><th>24h跌幅</th><th>OI持仓</th></tr></thead>
                <tbody id="losers"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
            </table>
        </div>
        
        <div class="card">
            <h2>⚡ 1分钟 OI 信号 (最新)</h2>
            <table>
                <thead><tr><th>时间</th><th>币种</th><th>OI变化</th><th>分析</th></tr></thead>
                <tbody id="signals1m"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
            </table>
        </div>
        
        <div class="card">
            <h2>📈 多周期信号</h2>
            <table>
                <thead><tr><th>时间</th><th>币种</th><th>周期</th><th>R值</th></tr></thead>
                <tbody id="signalsMulti"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
    
    <script>
        function formatTime(ts) {
            const d = new Date(ts * 1000);
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }
        
        function formatOI(oi) {
            if (oi >= 1e9) return (oi/1e9).toFixed(1) + 'B';
            if (oi >= 1e6) return (oi/1e6).toFixed(1) + 'M';
            return oi.toLocaleString();
        }
        
        async function loadGainers() {
            try {
                const r = await fetch('gainers.json');
                const data = await r.json();
                let html = '';
                data.forEach((x, i) => {
                    html += `<tr>
                        <td class="rank">${i+1}</td>
                        <td class="symbol">${x.symbol}</td>
                        <td>${parseFloat(x.price).toFixed(6)}</td>
                        <td class="positive">+${x.change.toFixed(2)}%</td>
                        <td class="oi">${formatOI(x.oi)}</td>
                    </tr>`;
                });
                document.getElementById('gainers').innerHTML = html;
            } catch(e) {
                document.getElementById('gainers').innerHTML = '<tr><td colspan="5" class="loading">加载失败</td></tr>';
            }
        }
        
        async function loadLosers() {
            try {
                const r = await fetch('losers.json');
                const data = await r.json();
                let html = '';
                data.forEach((x, i) => {
                    html += `<tr>
                        <td class="rank">${i+1}</td>
                        <td class="symbol">${x.symbol}</td>
                        <td>${parseFloat(x.price).toFixed(6)}</td>
                        <td class="negative">${x.change.toFixed(2)}%</td>
                        <td class="oi">${formatOI(x.oi)}</td>
                    </tr>`;
                });
                document.getElementById('losers').innerHTML = html;
            } catch(e) {
                document.getElementById('losers').innerHTML = '<tr><td colspan="5" class="loading">加载失败</td></tr>';
            }
        }
        
        async function loadSignals1m() {
            // 模拟显示
            document.getElementById('signals1m').innerHTML = '<tr><td colspan="4" class="loading">请运行1m监控脚本</td></tr>';
        }
        
        async function loadSignalsMulti() {
            document.getElementById('signalsMulti').innerHTML = '<tr><td colspan="4" class="loading">请运行多周期脚本</td></tr>';
        }
        
        async function loadAll() {
            document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
            await Promise.all([loadGainers(), loadLosers(), loadSignals1m(), loadSignalsMulti()]);
        }
        
        loadAll();
    </script>
</body>
</html>
